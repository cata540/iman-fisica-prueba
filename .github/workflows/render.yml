name: render-prueba
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependencias del sistema (Chromium headless + ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libasound2 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libpango-1.0-0 libcairo2 ffmpeg
      - run: npm ci
      - name: Renderizar prueba_30s.mp4
        run: |
          mkdir -p out
          npx remotion render src/index.ts Prueba out/prueba_30s.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p --gl=swangle --concurrency=2
      - name: Hoja de contacto 4x3 + medidas de audio
        run: |
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/prueba_30s.mp4)
          ffmpeg -y -i out/prueba_30s.mp4 -vf "fps=12/$D,scale=640:-1,tile=4x3" -frames:v 1 out/hoja_contacto_4x3.png
          { echo "duracion: $D"; ffmpeg -hide_banner -i out/prueba_30s.mp4 -af "volumedetect,silencedetect=n=-40dB:d=0.6" -f null - 2>&1 | grep -E "mean_volume|max_volume|silence_"; } | tee out/medidas.txt
      - uses: actions/upload-artifact@v4
        with:
          name: prueba
          path: out/*
          retention-days: 7
