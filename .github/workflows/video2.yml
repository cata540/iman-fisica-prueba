name: render-video2
on:
  workflow_dispatch:
    inputs:
      modo:
        description: prueba (30 s) o full (20 trozos)
        default: prueba
env:
  CHUNKS: 20
jobs:
  prueba:
    if: ${{ inputs.modo == 'prueba' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libasound2 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libpango-1.0-0 libcairo2 ffmpeg
      - run: npm ci
      - name: Renderizar 30 s
        run: |
          mkdir -p out
          npx remotion render src/index.ts Video2 out/mudo.mp4 --frames=0-899 --muted --codec=h264 --crf=18 --pixel-format=yuv420p --gl=swangle --concurrency=2
          ffmpeg -y -i out/mudo.mp4 -i public/audio/voz_v2.m4a -map 0:v -map 1:a -c:v copy -c:a copy -t 30 out/prueba_30s_video2.mp4
          ffmpeg -y -i out/prueba_30s_video2.mp4 -vf "fps=12/30,scale=640:-1,tile=4x3" -frames:v 1 out/hoja_contacto_video2.png
          { ffmpeg -hide_banner -i out/prueba_30s_video2.mp4 -af "volumedetect,silencedetect=n=-40dB:d=0.6" -f null - 2>&1 | grep -E "mean_volume|max_volume|silence_"; } | tee out/medidas.txt
          rm out/mudo.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: prueba2
          path: out/*
          retention-days: 7
