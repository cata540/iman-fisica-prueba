name: test-rapier
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libasound2 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libpango-1.0-0 libcairo2 ffmpeg
      - run: npm ci
      - name: Tres variantes a distintos fotogramas
        run: |
          mkdir -p out
          for m in A B C; do
            for f in 0 30 90; do
              npx remotion still src/index.ts TestFisica$m out/${m}_$f.png --frame=$f --gl=swangle --log=verbose > out/log_${m}_$f.txt 2>&1 || echo "FALLO $m $f"
            done
          done
          npx remotion still src/index.ts TestFisicaC out/C_30b.png --frame=30 --gl=swangle
          if cmp -s out/C_30.png out/C_30b.png; then echo "C: mismo fotograma, dos renders: IDENTICO" > out/resultado.txt; else echo "C: mismo fotograma, dos renders: DISTINTO" > out/resultado.txt; fi
          for m in A B C; do
            if cmp -s out/${m}_0.png out/${m}_90.png; then echo "$m: f0 y f90 IGUALES" >> out/resultado.txt; else echo "$m: f0 y f90 distintos" >> out/resultado.txt; fi
          done
          cat out/resultado.txt
          ffmpeg -y -i out/A_0.png -i out/A_90.png -i out/B_0.png -i out/B_90.png -i out/C_0.png -i out/C_30.png -i out/C_90.png -i out/C_30b.png -filter_complex "[0][1][2][3]hstack=4[a];[4][5][6][7]hstack=4[b];[a][b]vstack,scale=2560:-1" out/rapier_test.png
          grep -h "FISICA_R" out/log_C_0.txt out/log_C_30.txt out/log_C_90.txt | head -30 > out/log_resumen.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapier
          path: |
            out/rapier_test.png
            out/resultado.txt
            out/log_resumen.txt
            out/log_C_30.txt
